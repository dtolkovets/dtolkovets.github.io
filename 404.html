<style>
:root{
  --bg:#0a2352;--fg:#f2f6ff;--muted:#9fb4de;--line:#2c56a3;--accent:#9ad0ff;
  --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --sans:"Inter",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(rgba(255,255,255,.10) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:160px 160px,160px 160px,32px 32px,32px 32px;
  background-position:calc(50% + 80.5px) 0;
  display:flex;align-items:center;justify-content:center;padding:2rem;
}
main{max-width:34rem;background:rgba(10,35,82,.82);padding:2.5rem 2rem;border-radius:4px}
.kicker{font-family:var(--mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 .9rem}
h1{font-family:var(--display);font-size:clamp(1.6rem,4vw,2.2rem);font-weight:600;line-height:1.15;margin:0 0 .9rem}
p{color:var(--muted);line-height:1.6;margin:0 0 1.8rem}
a.btn{
  display:inline-flex;align-items:center;padding:.7rem 1.2rem;border-radius:4px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);text-decoration:none;
  font-family:var(--mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;font-weight:500;
  transition:border-color .15s ease,transform .15s ease;
}
a.btn:hover{border-color:var(--fg);transform:translateY(-1px)}
a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){a.btn{transition:none}a.btn:hover{transform:none}}
</style>
</head>
<body>
<main>
  <p class="kicker">Error 404</p>
  <h1>Page not found</h1>
  <p>This address does not exist on this site.</p>
  <a class="btn" href="./">← Home</a>
</main>
</body>
